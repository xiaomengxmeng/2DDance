<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素风平台跳跃游戏概念</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #222;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .section {
            background-color: #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 {
            color: #4ecdc4;
            border-bottom: 2px solid #4ecdc4;
            padding-bottom: 10px;
        }
        .concept-image {
            width: 100%;
            border-radius: 8px;
            margin: 10px 0;
        }
        .game-elements {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .element-card {
            background-color: #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .element-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .element-image {
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            border-radius: 4px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .control-key {
            background-color: #555;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>像素风平台跳跃游戏概念</h1>
        
        <div class="section">
            <h2>游戏风格</h2>
            <p>采用复古像素风格，8-bit或16-bit视觉效果，色彩鲜明，角色和场景设计简洁可爱。</p>
            <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=pixel%20art%20platformer%20game%20scene%20with%20retro%20style%2C%208-bit%20graphics%2C%20colorful%20platforms%2C%20simple%20character%2C%20side%20view&image_size=landscape_16_9" alt="游戏场景概念" class="concept-image">
        </div>
        
        <div class="section">
            <h2>游戏元素</h2>
            <div class="game-elements">
                <div class="element-card">
                    <h3>玩家角色</h3>
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=pixel%20art%20game%20character%2C%208-bit%20style%2C%20simple%20human%20figure%2C%20side%20view&image_size=square" alt="玩家角色" class="element-image">
                    <p>可移动、跳跃、攻击和防御</p>
                </div>
                <div class="element-card">
                    <h3>敌人</h3>
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=pixel%20art%20enemy%20character%2C%208-bit%20style%2C%20simple%20monster%2C%20side%20view&image_size=square" alt="敌人" class="element-image">
                    <p>具有基本AI行为，会攻击玩家</p>
                </div>
                <div class="element-card">
                    <h3>场景元素</h3>
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=pixel%20art%20platform%20elements%2C%208-bit%20style%2C%20blocks%2C%20platforms%2C%20obstacles&image_size=square" alt="场景元素" class="element-image">
                    <p>平台、障碍物、陷阱等</p>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>控制方案</h2>
            <div class="controls">
                <div class="control-key">← → 移动</div>
                <div class="control-key">↑ 跳跃</div>
                <div class="control-key">Z 攻击</div>
                <div class="control-key">X 防御</div>
                <div class="control-key">C 特殊技能</div>
                <div class="control-key">Space 暂停</div>
            </div>
        </div>
        
        <div class="section">
            <h2>游戏玩法</h2>
            <ul>
                <li>玩家通过平台跳跃到达终点</li>
                <li>与敌人战斗，使用攻击和防御</li>
                <li>收集道具和金币</li>
                <li>避免陷阱和障碍物</li>
                <li>生命值系统，被攻击会减少生命值</li>
                <li>达到终点或击败最终Boss获胜</li>
            </ul>
        </div>
    </div>
</body>
</html>
